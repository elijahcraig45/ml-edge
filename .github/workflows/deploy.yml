name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/338436483735/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ml-edge-deployer@mledge-20260420.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mledge \
            --source . \
            --region us-central1 \
            --project mledge-20260420 \
            --quiet

- id: returns-at-most-ef
  label: Returns at most ef nodes, ordered by distance
  code: |
    points = {0: (0.0,), 1: (1.0,), 2: (2.0,), 3: (3.0,), 4: (4.0,)}
    graph = {0: [1], 1: [0, 2], 2: [1, 3], 3: [2, 4], 4: [3]}
    out = greedy_search(graph, points, entry=0, query=(4.0,), ef=3)
    assert len(out) == 3, f"expected 3 results, got {out}"
    assert out == [4, 3, 2], f"expected [4, 3, 2] ordered by distance, got {out}"
- id: narrow-beam-gets-stuck
  label: ef = 1 stops at a local minimum
  code: |
    # "A" is closer to the query than both of its neighbours, so a beam of one
    # has nowhere to go — even though "N" is five times closer.
    points = {"E": (10.0, 0.0), "A": (5.0, 0.0), "B": (6.0, 0.0),
              "N": (0.5, 0.0), "F": (20.0, 0.0)}
    graph = {"E": ["A", "F"], "A": ["E", "B"], "B": ["A", "N"], "N": ["B"], "F": ["E"]}
    assert greedy_search(graph, points, "E", (0.0, 0.0), ef=1) == ["A"]
- id: wider-beam-escapes
  label: ef = 2 finds the true nearest neighbour
  code: |
    points = {"E": (10.0, 0.0), "A": (5.0, 0.0), "B": (6.0, 0.0),
              "N": (0.5, 0.0), "F": (20.0, 0.0)}
    graph = {"E": ["A", "F"], "A": ["E", "B"], "B": ["A", "N"], "N": ["B"], "F": ["E"]}
    assert greedy_search(graph, points, "E", (0.0, 0.0), ef=2) == ["N", "A"]
    assert greedy_search(graph, points, "E", (0.0, 0.0), ef=3) == ["N", "A", "B"]
- id: single-node
  label: A graph of one node returns that node
  code: |
    assert greedy_search({0: []}, {0: (1.0, 1.0)}, 0, (0.0, 0.0), ef=5) == [0]
- id: never-revisits
  label: A cyclic graph terminates
  hidden: true
  code: |
    # Every node points at every other node. Without a visited set this loops
    # forever; the harness would report a timeout rather than a failure.
    n = 40
    points = {i: (float(i),) for i in range(n)}
    graph = {i: [j for j in range(n) if j != i] for i in range(n)}
    out = greedy_search(graph, points, 0, (39.0,), ef=4)
    assert out == [39, 38, 37, 36], out
- id: recall-improves-with-ef
  label: Recall@5 rises with the beam width
  hidden: true
  code: |
    # The measurement that matters in production: on a real proximity graph,
    # recall is a function of ef. Seeded, so it is reproducible.
    import random
    random.seed(0)
    n = 200
    points = {i: (random.random(), random.random()) for i in range(n)}
    graph = {}
    for i in range(n):
        near = [j for _, j in sorted((distance(points[i], points[j]), j)
                                     for j in points if j != i)][:2]
        links = list(near)
        while len(links) < 8:
            j = random.randrange(n)
            if j != i and j not in links:
                links.append(j)
        graph[i] = links
    queries = [(random.random(), random.random()) for _ in range(30)]

    def recall(ef):
        total = 0.0
        for q in queries:
            truth = set(j for _, j in sorted((distance(points[j], q), j) for j in points)[:5])
            found = set(greedy_search(graph, points, 0, q, ef)[:5])
            total += len(truth & found) / 5
        return total / len(queries)

    r1, r5, r50 = recall(1), recall(5), recall(50)
    assert r1 < 0.35, f"ef=1 recall {r1} — a beam of one should get stuck often"
    assert r5 > r1, f"recall did not improve from ef=1 ({r1}) to ef=5 ({r5})"
    assert r50 > 0.9, f"ef=50 recall {r50} — a wide beam should find nearly everything"

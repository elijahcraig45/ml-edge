- id: second-chance
  label: A re-referenced entry survives one sweep
  code: |
    # Slots fill as 1, 2, 3. The second request for 1 sets its bit. When 4
    # arrives the hand is at 1's slot, finds the bit set, clears it and moves on,
    # so 2 is evicted instead. Plain FIFO would have evicted 1 and scored 1 hit.
    assert clock_hits(3, [1, 2, 3, 1, 4, 5, 1]) == 2
- id: small-sequence
  label: A short trace
  code: |
    assert clock_hits(2, [1, 2, 1, 3, 1, 2]) == 2
- id: repeats-and-empty
  label: Repeats hit, and an empty request list is zero
  code: |
    assert clock_hits(3, []) == 0
    assert clock_hits(3, [5, 5, 5]) == 2
    assert clock_hits(1, [1, 1, 2, 2, 1]) == 2
- id: cyclic-scan
  label: A cyclic scan one larger than the cache gets nothing
  code: |
    # Four keys through three slots. Recency-flavoured policies all score zero
    # here — this is the sequential-scan worst case, not a contrived one.
    assert clock_hits(3, [i % 4 for i in range(40)]) == 0
- id: hot-set-workload
  label: Hot set plus scanning noise
  hidden: true
  code: |
    # Pinned against the reference implementation. random.Random(0) is seeded
    # explicitly, so this is reproducible everywhere. Plain FIFO scores 9829.
    import random
    rnd = random.Random(0)
    requests = []
    for _ in range(20_000):
        if rnd.random() < 0.8:
            requests.append(rnd.randrange(50))
        else:
            requests.append(100 + rnd.randrange(5_000))
    assert clock_hits(50, requests) == 11809
    assert clock_hits(100, requests) == 15890
- id: capacity-never-exceeded
  label: The hand stays in range and slots are never double-booked
  hidden: true
  code: |
    # Catches a sweep that runs off the end of the array, and a stale slot_of
    # entry left behind by an eviction.
    import random
    rnd = random.Random(1)
    requests = [rnd.randrange(200) for _ in range(5_000)]
    hits = clock_hits(8, requests)
    assert 0 < hits < len(requests), f"implausible hit count {hits}"
    assert clock_hits(1, [1, 2, 1, 2, 1, 2]) == 0

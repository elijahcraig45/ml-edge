- id: dumbbell
  label: Enough trials find the true minimum cut
  code: |
    import random
    random.seed(0)
    E = [(0,1),(0,2),(0,3),(1,2),(1,3),(2,3),
         (4,5),(4,6),(4,7),(5,6),(5,7),(6,7),
         (0,4),(3,7)]
    assert karger_min_cut(8, E, 200) == 2

- id: cycle-and-star
  label: Two more graphs with known minimum cuts
  code: |
    import random
    random.seed(0)
    cycle = [(i, (i + 1) % 6) for i in range(6)]
    assert karger_min_cut(6, cycle, 100) == 2
    star = [(0, i) for i in range(1, 6)]
    assert karger_min_cut(6, star, 60) == 1

- id: never-below-the-truth
  label: No run ever reports a cut smaller than the real minimum
  code: |
    import random
    def brute(n, edges):
        best = len(edges)
        for mask in range(1, 1 << (n - 1)):
            side = {i for i in range(n - 1) if mask >> i & 1}
            best = min(best, sum(1 for a, b in edges if (a in side) != (b in side)))
        return best
    GRAPHS = [
        (4, [(0,1),(1,2),(2,3),(3,0)]),
        (6, [(i, (i + 1) % 6) for i in range(6)]),
        (6, [(0,1),(0,2),(1,2),(3,4),(3,5),(4,5),(2,3)]),
        (5, [(0,1),(0,2),(0,3),(0,4),(1,2),(3,4)]),
    ]
    random.seed(0)
    for n, edges in GRAPHS:
        truth = brute(n, edges)
        for trials in (1, 3, 25):
            got = karger_min_cut(n, edges, trials)
            assert got >= truth, ("reported a cut smaller than the minimum", n, got, truth)
        assert karger_min_cut(n, edges, 150) == truth, ("never found it", n, truth)

- id: one-run-is-unreliable
  label: Single runs overshoot, which is why repetition exists
  code: |
    import random
    random.seed(0)
    E = [(0,1),(0,2),(0,3),(1,2),(1,3),(2,3),
         (4,5),(4,6),(4,7),(5,6),(5,7),(6,7),
         (0,4),(3,7)]
    singles = [karger_min_cut(8, E, 1) for _ in range(20)]
    assert all(s >= 2 for s in singles), singles
    assert max(singles) > 2, ("twenty single runs all found the optimum — "
                              "that is not what a 2/n^2 success rate looks like", singles)

- id: amplification-count
  label: The repetition count matches the amplification bound
  code: |
    assert trials_for_confidence(10, 0.01) == 205
    assert trials_for_confidence(4, 0.05) == 17
    assert trials_for_confidence(2, 0.5) == 1
    assert trials_for_confidence(5, 0.5) == 7

- id: amplification-scales
  label: The count grows like n squared times ln(1/delta)
  hidden: true
  code: |
    assert trials_for_confidence(100, 1e-6) == 68380
    assert trials_for_confidence(20, 0.01) == 873
    assert trials_for_confidence(6, 0.001) == 101
    # 1/p repetitions is NOT enough: it leaves failure probability about 1/e.
    p = 2.0 / (10 * 9)
    assert (1 - p) ** int(1 / p) > 0.3

- id: tiny-graphs
  label: Graphs with fewer than two vertices have no cut
  hidden: true
  code: |
    import random
    random.seed(0)
    assert karger_min_cut(0, [], 5) == 0
    assert karger_min_cut(1, [], 5) == 0
    assert karger_min_cut(2, [(0, 1)], 5) == 1
    assert karger_min_cut(2, [(0, 1), (0, 1)], 5) == 2

- id: disconnected
  label: A disconnected graph has a cut of size zero
  hidden: true
  code: |
    import random
    random.seed(0)
    assert karger_min_cut(4, [(0, 1), (2, 3)], 30) == 0

- id: parallel-edges-count
  label: Parallel edges are separate edges, not duplicates to remove
  hidden: true
  code: |
    import random
    random.seed(0)
    # A triangle with the (0,1) edge tripled. The cheapest cut isolates vertex 2.
    edges = [(0, 1), (0, 1), (0, 1), (1, 2), (2, 0)]
    assert karger_min_cut(3, edges, 100) == 2

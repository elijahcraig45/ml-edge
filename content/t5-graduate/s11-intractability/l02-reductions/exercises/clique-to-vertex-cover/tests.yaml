- id: complement-shape
  label: The graph is complemented and the vertex set is unchanged
  code: |
    n2, edges2, k2 = clique_to_vertex_cover(4, [(0,1),(1,2),(2,3),(3,0)], 2)
    assert n2 == 4
    assert {(min(u,v), max(u,v)) for u, v in edges2} == {(0, 2), (1, 3)}
    assert k2 == 2

- id: answers-agree
  label: Yes-instances and no-instances both survive the mapping
  code: |
    from itertools import combinations
    def has_clique(n, edges, k):
        if k > n:
            return False
        e = {(min(u,v), max(u,v)) for u, v in edges}
        return any(all((min(u,v), max(u,v)) in e for u, v in combinations(sub, 2))
                   for sub in combinations(range(n), k))
    def has_cover(n, edges, k):
        if k < 0:
            return False
        e = [(u, v) for u, v in edges]
        for size in range(0, min(k, n) + 1):
            for sub in combinations(range(n), size):
                s = set(sub)
                if all(u in s or v in s for u, v in e):
                    return True
        return False
    CASES = [
        (4, [(0,1),(1,2),(2,3),(3,0)], 2),
        (4, [(0,1),(1,2),(2,3),(3,0)], 3),
        (5, [(0,1),(0,2),(1,2),(2,3),(3,4)], 3),
        (5, [(0,1),(0,2),(1,2),(2,3),(3,4)], 4),
        (6, [(0,1),(0,2),(0,3),(1,2),(1,3),(2,3),(4,5)], 4),
        (6, [(0,1),(0,2),(0,3),(1,2),(1,3),(2,3),(4,5)], 5),
        (3, [], 1),
        (3, [], 2),
    ]
    for n, edges, k in CASES:
        n2, edges2, k2 = clique_to_vertex_cover(n, edges, k)
        assert has_clique(n, edges, k) == has_cover(n2, edges2, k2), \
            ("answer changed", n, edges, k, k2)

- id: certificate-verifies
  label: The transformed certificate is a cover of the produced graph
  code: |
    from itertools import combinations
    CASES = [
        (4, [(0,1),(1,2),(2,3),(3,0)], 2, {0, 1}),
        (5, [(0,1),(0,2),(1,2),(2,3),(3,4)], 3, {0, 1, 2}),
        (6, [(0,1),(0,2),(0,3),(1,2),(1,3),(2,3),(4,5)], 4, {0, 1, 2, 3}),
    ]
    for n, edges, k, clique in CASES:
        n2, edges2, k2 = clique_to_vertex_cover(n, edges, k)
        cert = set(clique_to_cover_certificate(n, edges, k, clique))
        assert len(cert) <= k2, ("certificate too large", n, k, cert, k2)
        assert all(u in cert or v in cert for u, v in edges2), \
            ("certificate is not a cover", n, k, cert)

- id: complete-graph
  label: A complete graph complements to no edges at all
  hidden: true
  code: |
    edges = [(u, v) for u in range(5) for v in range(u + 1, 5)]
    n2, edges2, k2 = clique_to_vertex_cover(5, edges, 5)
    assert set(edges2) == set()
    assert k2 == 0

- id: empty-graph
  label: A graph with no edges complements to a complete graph
  hidden: true
  code: |
    n2, edges2, k2 = clique_to_vertex_cover(4, [], 2)
    assert {(min(u,v), max(u,v)) for u, v in edges2} == {
        (0,1),(0,2),(0,3),(1,2),(1,3),(2,3)}
    assert k2 == 2

- id: k-zero
  label: k = 0 maps to a cover budget of n
  hidden: true
  code: |
    n2, edges2, k2 = clique_to_vertex_cover(4, [(0,1),(2,3)], 0)
    assert k2 == 4
    cert = set(clique_to_cover_certificate(4, [(0,1),(2,3)], 0, set()))
    assert all(u in cert or v in cert for u, v in edges2)

- id: certificate-is-a-complement
  label: The certificate is disjoint from the clique and covers the rest
  hidden: true
  code: |
    edges = [(0,1),(0,2),(1,2),(2,3),(3,4)]
    cert = set(clique_to_cover_certificate(5, edges, 3, {0, 1, 2}))
    assert cert == {3, 4}

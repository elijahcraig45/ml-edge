- id: simple
  label: Counts overlapping subarrays
  code: |
    assert count_subarrays([1, 1, 1], 2) == 2
    assert count_subarrays([1, 2, 3], 3) == 2
- id: negatives
  label: Handles negative values, where a sliding window would fail
  code: |
    assert count_subarrays([3, -1, 2, -1, 3], 3) == 4
- id: starts-at-zero
  label: Counts subarrays that begin at index 0
  code: |
    assert count_subarrays([5], 5) == 1
    assert count_subarrays([2, 3], 5) == 1
- id: no-match
  label: Returns 0 when nothing sums to k
  code: |
    assert count_subarrays([1, 2, 3], 100) == 0
    assert count_subarrays([], 0) == 0
- id: zeros-and-empty-k
  label: Zeros produce many matches, and k can be zero or negative
  hidden: true
  code: |
    assert count_subarrays([0, 0, 0], 0) == 6
    assert count_subarrays([1, -1, 1, -1], 0) == 4
    assert count_subarrays([-2, -3, 5], -5) == 1
- id: matches-brute-force
  label: Agrees with the quadratic definition on random arrays
  hidden: true
  code: |
    import random

    def brute(nums, k):
        total = 0
        for i in range(len(nums)):
            running = 0
            for j in range(i, len(nums)):
                running += nums[j]
                if running == k:
                    total += 1
        return total

    random.seed(19)
    for _ in range(60):
        nums = [random.randint(-4, 4) for _ in range(random.randint(0, 40))]
        for k in (-3, 0, 2):
            assert count_subarrays(nums, k) == brute(nums, k), (nums, k)

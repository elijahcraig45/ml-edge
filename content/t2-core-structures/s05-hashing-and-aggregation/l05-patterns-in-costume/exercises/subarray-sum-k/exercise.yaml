id: subarray-sum-k
kind: python
title: Count subarrays summing to k
difficulty: 4
pattern: prefix-sum-hashmap
topics: [hashing, arrays, prefix-sums]
timeLimitMs: 60000
prompt: |
  Return how many **contiguous** subarrays of `nums` sum to exactly `k`.
  Subarrays may overlap, and each starting/ending index pair counts separately.

  ```
  count_subarrays([1, 1, 1], 2)          # 2   -> [1,1] at 0..1 and at 1..2
  count_subarrays([3, -1, 2, -1, 3], 3)  # 4
  count_subarrays([0, 0, 0], 0)          # 6
  ```

  `nums` can contain negative numbers and zero, and `k` can be negative. That
  rules out a sliding window: with negatives the sum is not monotone in the
  window width, so there is no valid rule for when to shrink.

  **This exercise has a complexity budget.** The starter is the quadratic
  definition — it is correct and it will fail. The hidden performance check runs
  your function on 20,000 elements, which a nested loop cannot finish inside the
  budget.

  Two details the tests care about: subarrays that start at index 0 must be
  counted, and a run of zeros produces one match per index pair, not one match.
hints:
  - "Let P[j] be the sum of the first j elements. Write the sum of the subarray from i to j in terms of two prefix sums, and the question stops being about subarrays."
  - "sum(i..j) = P[j+1] - P[i], so a subarray sums to k exactly when P[j+1] - P[i] = k. Walking left to right, at each position you need to know how many earlier prefix sums equal (current prefix - k)."
  - "Keep a dict from prefix sum to how many times it has occurred. Add to the answer *before* recording the current prefix — and seed the dict with the empty prefix, `{0: 1}`, or every subarray starting at index 0 goes uncounted."
solutionWalkthrough: |
  ```python
  def count_subarrays(nums, k):
      counts = {0: 1}
      running = 0
      total = 0
      for x in nums:
          running += x
          total += counts.get(running - k, 0)
          counts[running] = counts.get(running, 0) + 1
      return total
  ```

  The rewrite is the whole idea. `sum(i..j) = P[j+1] - P[i]`, so counting
  subarrays that sum to $k$ is counting *pairs* of prefix sums that differ by
  $k$ — which is two-sum with the array of prefix sums as input. One pass, one
  map, $O(n)$ time and $O(d)$ space where $d$ is the number of distinct prefix
  sums.

  **`counts = {0: 1}` is data, not a fudge.** $P_0 = 0$ is the sum of the empty
  prefix, it is a genuine prefix sum, and it has occurred once before the loop
  starts. Every subarray beginning at index 0 pairs with it. On
  `[3, -1, 2, -1, 3]` with $k = 3$ the answer is 4; start from an empty dict and
  you get 2, and the two you lose are exactly the ones anchored at index 0.
  Using `.get(..., 0)` stops the KeyError but does not restore the count, which
  is what makes this bug survive a code review.

  **The lookup must precede the record.** Adding the current prefix to the map
  first would let a subarray of length 0 count itself whenever $k = 0$, which is
  why `count_subarrays([0, 0, 0], 0)` distinguishes a correct solution from a
  nearly correct one: 6, not 9.

  **The trade you are making**, and the sentence to say out loud: $O(n)$ extra
  space in exchange for taking the time from $O(n^2)$ to $O(n)$. It is a good
  trade here and it is not universally a good trade — if $n$ is 20,000 the map
  is nothing, and if the array is a hundred-billion-row event stream the map is
  the problem, which is where Count–Min Sketch and the approximate counters of
  Lesson 6 come in.

  The skeleton generalises. Store the *first index* of each prefix sum instead
  of a count and you get "longest subarray summing to k". Key on `running % k`
  and you get "subarrays divisible by k". Key on a running difference and you
  get "longest balanced substring". Four LeetCode problems, one derivation.

# The stated claim is about running time, and both solutions return the right
# answer, so only a budget can reject the quadratic one.
#
# Measured under CPython 3.13 on 20,000 elements drawn from [-3, 3]:
#   prefix-sum map:  ~1.5 ms
#   nested loops:    ~5,560 ms
# 400 ms sits ~270x above the fast solution and ~14x below the slow one, so it
# separates them with room for Pyodide, which runs roughly 3-5x slower than
# CPython. maxMs rather than maxOps: the quadratic version's inner loop is
# Python-level here, but the fast version's work happens inside dict lookups
# written in C, which emit no line events at all -- an operation counter
# measures the wrong thing.
complexityBudget:
  setup: |
    import random
    random.seed(5)
    data = [random.randint(-3, 3) for _ in range(20000)]
  call: |
    count_subarrays(data, 2)
  maxMs: 400
  message: >-
    Correct, but quadratic: this re-adds the same elements once per starting
    index. Rewrite each subarray sum as a difference of two prefix sums and
    keep a map of the prefix sums you have already seen, so one pass answers
    the question.

- id: middle-window
  label: Finds a qualifying run in the middle
  code: |
    assert longest_under([770, 850, 490, 570, 650], 2000) == 3
- id: whole-list
  label: A generous budget admits the whole list
  code: |
    assert longest_under([1, 2, 3, 4], 100) == 4
- id: nothing-fits
  label: Every day exceeds the budget on its own
  code: |
    assert longest_under([5, 5, 5], 4) == 0
- id: empty
  label: An empty list has no run
  code: |
    assert longest_under([], 100) == 0
- id: exact-budget
  label: A total exactly equal to the budget qualifies
  code: |
    assert longest_under([10, 10, 10], 20) == 2
    assert longest_under([10, 10, 10], 30) == 3
- id: zeros-and-a-spike
  label: Zeros extend a window; a spike must not end the search
  hidden: true
  code: |
    # The best run is the four zeros after the spike, not anything before it.
    assert longest_under([1, 1, 999, 0, 0, 0, 0], 3) == 4
    assert longest_under([0, 0, 0], 0) == 3
- id: window-must-reopen
  label: The window recovers after being emptied
  hidden: true
  code: |
    # 100 blows the budget on its own, so `left` has to pass it entirely.
    assert longest_under([1, 1, 1, 100, 1, 1, 1, 1], 3) == 3
    assert longest_under([100], 3) == 0
    assert longest_under([100, 1], 3) == 1

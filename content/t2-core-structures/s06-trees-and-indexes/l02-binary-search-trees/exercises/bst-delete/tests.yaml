- id: one-child
  label: Deleting a node with a single child promotes that child
  code: |
    def walk(n):
        return [] if n is None else walk(n[1]) + [n[0]] + walk(n[2])

    tree = (50, (30, (20, None, None), None), None)
    result = bst_delete(tree, 30)
    assert walk(result) == [20, 50]
    assert result[1][0] == 20
- id: two-children
  label: Deleting a two-child node promotes the inorder successor
  code: |
    def walk(n):
        return [] if n is None else walk(n[1]) + [n[0]] + walk(n[2])

    tree = (50, (30, None, None), (70, (60, None, None), (80, None, None)))
    result = bst_delete(tree, 50)
    assert result[0] == 60
    assert walk(result) == [30, 60, 70, 80]

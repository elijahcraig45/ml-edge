- id: interleaves
  label: Interleaves two ascending streams
  code: |
    assert list(merge_sorted([1, 3, 5], [2, 4, 6])) == [1, 2, 3, 4, 5, 6]
- id: one-side-empty
  label: An empty side passes the other through
  code: |
    assert list(merge_sorted([], [1, 2])) == [1, 2]
    assert list(merge_sorted([1, 2], [])) == [1, 2]
    assert list(merge_sorted([], [])) == []
- id: uneven-lengths
  label: Drains whichever side is longer
  code: |
    assert list(merge_sorted([1, 2, 3, 9], [4])) == [1, 2, 3, 4, 9]
- id: duplicates
  label: Keeps every duplicate from both sides
  code: |
    assert list(merge_sorted([1, 1, 2], [1, 3])) == [1, 1, 1, 2, 3]
- id: stays-lazy
  label: Reads only as far as the caller asks
  code: |
    # Both sources raise if drained past ten values. A merge that materialises
    # its inputs trips them before yielding anything; a lazy one never gets
    # near the end.
    def evens():
        for value in range(0, 20, 2):
            yield value
        raise AssertionError("merge_sorted drained the left stream")

    def odds():
        for value in range(1, 21, 2):
            yield value
        raise AssertionError("merge_sorted drained the right stream")

    stream = merge_sorted(evens(), odds())
    assert [next(stream) for _ in range(8)] == [0, 1, 2, 3, 4, 5, 6, 7]
- id: ties-favour-left
  label: On equal values the left side is yielded first
  hidden: true
  code: |
    # Merge joins must be stable: equal keys keep their input order, which is
    # what lets the operator above rely on left-then-right grouping.
    class Keyed:
        def __init__(self, key, tag):
            self.key = key
            self.tag = tag
        def __lt__(self, other):
            return self.key < other.key

    left = [Keyed(1, "L1"), Keyed(2, "L2")]
    right = [Keyed(1, "R1"), Keyed(2, "R2")]
    tags = [item.tag for item in merge_sorted(left, right)]
    assert tags == ["L1", "R1", "L2", "R2"], tags
- id: falsy-values-survive
  label: Empty strings and zeros are data, not end-of-stream markers
  hidden: true
  code: |
    # A sentinel of None, 0, or "" would truncate these streams. This is why
    # the end marker has to be an object that cannot appear in the input.
    assert list(merge_sorted(["", "b"], ["a", "c"])) == ["", "a", "b", "c"]
    assert list(merge_sorted([0, 5], [0, 9])) == [0, 0, 5, 9]

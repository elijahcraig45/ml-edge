id: merge-streams
kind: python
title: A merge operator that never holds more than two rows
difficulty: 4
pattern: generator
topics: [generators, laziness, merge]
timeLimitMs: 15000
forbid:
  - "sorted("
  - ".sort("
  - "heapq"
  - "heapmerge"
prompt: |
  Merge two already-ascending streams into one ascending stream.

  ```
  list(merge_sorted([1, 3, 5], [2, 4, 6]))   # [1, 2, 3, 4, 5, 6]
  list(merge_sorted([1, 1, 2], [1, 3]))      # [1, 1, 1, 2, 3]
  ```

  Rules that make this the exercise it is:

  - **Lazy.** Hold at most one item from each side at a time, and read no
    further than the caller has asked for. A test attaches two sources that
    raise if they are drained, and takes only the first eight values.
  - **Stable.** When the two sides offer equal values, yield the left one
    first.
  - No sorting, no heap. Both inputs are already ordered; the point is to use
    that.

  `left` and `right` may be any iterables, including generators you can walk
  only once.
hints:
  - "You cannot index an iterable you can only walk once, so start by turning both sides into iterators with `iter()`. Now `next()` is the only move you have, and that is enough."
  - "Keep one item from each side in hand. Yield the smaller, then refill only the side you took from — the other one is still holding its item, unconsumed."
  - "`next(it, sentinel)` returns your sentinel instead of raising when the iterator runs dry. Use a unique object as the sentinel, not None and not -1, because those are values a real stream might contain."
solutionWalkthrough: |
  ```python
  _DONE = object()

  def merge_sorted(left, right):
      left, right = iter(left), iter(right)
      a = next(left, _DONE)
      b = next(right, _DONE)
      while a is not _DONE and b is not _DONE:
          if b < a:
              yield b
              b = next(right, _DONE)
          else:
              yield a
              a = next(left, _DONE)
      while a is not _DONE:
          yield a
          a = next(left, _DONE)
      while b is not _DONE:
          yield b
          b = next(right, _DONE)
  ```

  **`if b < a` rather than `if a <= b`** is what makes it stable, and it is
  worth seeing why. When the two are equal, `b < a` is false, so the `else`
  branch runs and the left item goes first. Writing the comparison the other
  way round — `if a > b: yield b` — is equivalent; writing `if a < b: yield a`
  is not, because it sends ties to the right.

  **`_DONE = object()`** is a sentinel that cannot collide with real data. A
  stream can legitimately contain `None`, `-1`, `float("inf")`, or the empty
  string. A fresh anonymous object is the only value guaranteed not to be in
  your input, and `is` comparison against it is exact and free.

  **The memory profile is the whole point.** At any instant this function holds
  two items — `a` and `b` — regardless of whether the streams are ten values
  long or endless. The starter is a correct merge and still wrong for the job:
  it reads both inputs to the end before it produces anything, so its memory
  grows with the input and it can never be attached to a stream that has not
  finished arriving.

  **This function is a merge join.** Give both inputs sorted on the join key
  and this same loop, with "yield the matching pair" in place of "yield the
  smaller", is the merge-join operator in a database. It is the reason engines
  will pay to sort inputs, or keep a clustered index: once both sides are
  ordered, the join costs one pass and constant memory, and no hash table has
  to fit anywhere.

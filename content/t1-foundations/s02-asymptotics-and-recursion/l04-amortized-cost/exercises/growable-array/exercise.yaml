id: growable-array
kind: python
title: Build the dynamic array and count what it copies
difficulty: 3
pattern: amortized-analysis
topics: [amortized-analysis]
timeLimitMs: 30000
prompt: |
  Implement `GrowableArray`, a list built on a fixed-size backing store that
  reallocates when it fills. The whole point is the `copies` counter: it turns
  the aggregate-method argument into a number you can check.

  Required interface:

  - `GrowableArray()` — starts empty, with `capacity == 0` and `copies == 0`.
  - `append(value)` — if `len(self) == self.capacity`, first grow: the new
    capacity is `1` when the capacity is 0, otherwise **twice** the current
    capacity. Moving the existing elements into the new store adds that many to
    `self.copies`. Then store the value.
  - `__len__()` — the number of elements appended.
  - `__getitem__(index)` — the element at that index.
  - `capacity` and `copies` readable as attributes.

  ```python
  a = GrowableArray()
  for value in "abcde":
      a.append(value)
  len(a), a.capacity, a.copies   # (5, 8, 7)
  a[3]                           # 'd'
  ```

  Check the arithmetic on that example before you start: capacities go
  0 → 1 → 2 → 4 → 8, copying 0 then 1 then 2 then 4 elements — seven copies for
  five appends. One hidden test does the same accounting at 5,000 appends and
  requires the total to stay under $2n$.
hints:
  - "Keep two things: a backing list of fixed length (`[None] * capacity`) and a count of how many slots are actually in use. `len(self)` is the count, not the length of the backing list."
  - "Grow *before* storing, and only when the count has reached the capacity. The number of elements you move into the new store is exactly the current count — add that to `copies` before you copy, or after, but do not add the new element."
  - "`__len__` must return the used count. If you return `len(self._slots)` you will report the capacity, every `__getitem__` past the end will hand back `None`, and the copies count will be right for the wrong reasons."
solutionWalkthrough: |
  ```python
  class GrowableArray:
      def __init__(self):
          self._slots = []
          self._size = 0
          self.capacity = 0
          self.copies = 0

      def _grow(self):
          new_capacity = 1 if self.capacity == 0 else self.capacity * 2
          bigger = [None] * new_capacity
          for i in range(self._size):
              bigger[i] = self._slots[i]
          self.copies += self._size
          self._slots = bigger
          self.capacity = new_capacity

      def append(self, value):
          if self._size == self.capacity:
              self._grow()
          self._slots[self._size] = value
          self._size += 1

      def __len__(self):
          return self._size

      def __getitem__(self, index):
          if not 0 <= index < self._size:
              raise IndexError(index)
          return self._slots[index]
  ```

  The copy loop is written out rather than using a slice assignment on purpose:
  `self.copies += self._size` has to be the same number as the work actually
  done, and a slice would hide the loop that justifies it. In production you
  would let the runtime do the move with `memcpy`; the constant changes, the
  count does not.

  Run it for a few sizes and the aggregate argument appears in the output:

  | appends | capacity | copies | copies per append |
  | --- | --- | --- | --- |
  | 1,000 | 1,024 | 1,023 | 1.02 |
  | 5,000 | 8,192 | 8,191 | 1.64 |
  | 100,000 | 131,072 | 131,071 | 1.31 |

  `copies` is always one less than the capacity, because the copy totals are
  $1 + 2 + \dots + c/2 = c - 1$. The ratio wobbles between 1 and 2 depending on
  where $n$ falls between two powers of two, and never escapes that band. That
  band is the theorem.

  The separate `_size` field is the design decision worth carrying forward.
  Length and capacity are different quantities, and every dynamic array in every
  language keeps both — Go's `len` and `cap`, C++'s `size()` and `capacity()`,
  Rust's `len()` and `capacity()`. Conflating them is how you end up with an
  array full of trailing `None`s.

  The bound this measures is amortized, not worst case. The 5,000th append in the
  table copied 4,096 elements by itself. Nothing in the analysis makes that call
  fast; it makes it rare.

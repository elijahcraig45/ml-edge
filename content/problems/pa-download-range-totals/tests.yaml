- id: basic
  label: Answers several ranges in order
  code: |
    assert range_totals([1, 2, 3, 4], [(0, 1), (1, 3), (2, 2)]) == [3, 9, 3]
- id: whole-list
  label: A range covering everything is the total
  code: |
    assert range_totals([5, 5, 5], [(0, 2)]) == [15]
- id: no-ranges
  label: No questions asked, no answers given
  code: |
    assert range_totals([1, 2, 3, 4], []) == []
- id: single-day-ranges
  label: A range of one day is that day
  code: |
    assert range_totals([7, 8, 9], [(0, 0), (2, 2)]) == [7, 9]
- id: starts-at-zero-and-repeats
  label: Ranges starting at index 0, and the same range asked twice
  hidden: true
  code: |
    assert range_totals([4, 0, 6], [(0, 0), (0, 2), (0, 2)]) == [4, 10, 10]
    assert range_totals([9], [(0, 0)]) == [9]
- id: negatives-and-empty-input
  label: Negative counts, an empty log, and an untouched input
  hidden: true
  code: |
    assert range_totals([-1, 5, -2], [(0, 2), (0, 0), (2, 2)]) == [2, -1, -2]
    assert range_totals([], []) == []
    original = [1, 2, 3]
    range_totals(original, [(0, 1)])
    assert original == [1, 2, 3], "the input must not be modified"

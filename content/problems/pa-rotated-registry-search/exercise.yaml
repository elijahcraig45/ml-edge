id: pa-rotated-registry-search
kind: python
title: Search a mirror list that got rotated
difficulty: 4
pattern: binary-search
stage: s04-sorting-and-windows
topics:
  - arrays
timeLimitMs: 15000
prompt: |
  A mirror publishes its package ids in sorted order, but the copy you received
  starts at an arbitrary offset and wraps around: `[7, 9, 1, 3, 5]` is the
  sorted list `[1, 3, 5, 7, 9]` rotated left by three. All ids are distinct, and
  the rotation may be zero.

  Return the index of `target` in the rotated list, or `-1` if it is absent.

  ```
  find_rotated([7, 9, 1, 3, 5], 3)   # 3
  find_rotated([7, 9, 1, 3, 5], 4)   # -1
  find_rotated([1, 2, 3], 1)         # 0
  ```

  Do it in logarithmic time. `.index(` and `sorted(` are rejected, and so is
  scanning the list.
hints:
  - "Cut the list in half at any point. One of the two halves is still in plain sorted order — and you can tell which by comparing its endpoints."
  - "If `values[lo] <= values[mid]`, the left half is sorted; otherwise the right half is. Inside the sorted half you can decide by range comparison whether the target is there."
  - "When the left half is sorted, keep it only if `values[lo] <= target < values[mid]`; otherwise search right. Mirror that for the sorted right half. Every step discards half the list, exactly as an unrotated binary search would."
solutionWalkthrough: |
  ```python
  def find_rotated(values, target):
      lo, hi = 0, len(values) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if values[mid] == target:
              return mid
          if values[lo] <= values[mid]:
              if values[lo] <= target < values[mid]:
                  hi = mid - 1
              else:
                  lo = mid + 1
          else:
              if values[mid] < target <= values[hi]:
                  lo = mid + 1
              else:
                  hi = mid - 1
      return -1
  ```

  Binary search normally needs a sorted list; a rotated list is not sorted, but
  it is *two* sorted lists glued together, and any midpoint puts the seam in one
  half and not the other. Identifying the intact half is what restores the
  ability to rule out half the data per step, which is the whole content of
  binary search.

  Finding the rotation point first and then searching the correct half is
  equally logarithmic and, in an interview, easier to defend — two simple
  searches instead of one search with four branches. The version above is one
  pass and avoids the index arithmetic that the two-phase approach needs.

  Distinctness is load-bearing. With duplicates allowed, `values[lo]`,
  `values[mid]` and `values[hi]` can all be equal, which tells you nothing about
  where the seam is, and the worst case degrades to O(n). That is the honest
  answer to "what if there are duplicates" — not a patch, a different bound.
forbid:
  - ".index("
  - "sorted("

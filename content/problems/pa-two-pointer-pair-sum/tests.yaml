- id: basic
  label: Finds a pair in the middle of the list
  code: |
    assert pair_summing_to([1, 3, 4, 9], 7) == (1, 2)
- id: ends
  label: Finds a pair made of the two extremes
  code: |
    assert pair_summing_to([2, 5, 8, 20], 22) == (0, 3)
- id: no-pair
  label: Returns None when nothing adds up
  code: |
    assert pair_summing_to([1, 3, 4, 9], 100) is None
- id: too-short
  label: Fewer than two entries has no pair
  code: |
    assert pair_summing_to([], 0) is None
    assert pair_summing_to([5], 5) is None
- id: smallest-i
  label: Reports the pair with the smallest left index
  hidden: true
  code: |
    # (0, 4) and (1, 3) both sum to 8; the answer is the one starting earliest.
    assert pair_summing_to([1, 3, 4, 5, 7], 8) == (0, 4)
- id: negatives-and-duplicates
  label: Handles negative totals and repeated values
  hidden: true
  code: |
    assert pair_summing_to([-8, -3, -3, 0, 4], -6) == (1, 2)
    assert pair_summing_to([-5, -1, 2, 6], 1) == (0, 3)
    original = [-2, 0, 2]
    pair_summing_to(original, 0)
    assert original == [-2, 0, 2], "the input must not be modified"

- id: basic
  label: Finds the slowest workable rate
  code: |
    assert slowest_rate([3, 6, 7, 11], 8) == 4
- id: one-hour-each
  label: Exactly as many hours as packages forces the largest rate
  code: |
    assert slowest_rate([3, 6, 7, 11], 4) == 11
- id: impossible
  label: Fewer hours than packages can never work
  code: |
    assert slowest_rate([3], 0) is None
    assert slowest_rate([3, 6, 7, 11], 3) is None
- id: empty
  label: An empty queue needs no bandwidth
  code: |
    assert slowest_rate([], 5) == 0
    assert slowest_rate([], 0) == 0
- id: generous-hours
  label: Plenty of hours drives the rate down to 1
  hidden: true
  code: |
    assert slowest_rate([3, 6, 7, 11], 27) == 1
    assert slowest_rate([1, 1, 1], 3) == 1
- id: all-equal-and-single
  label: Equal sizes, one package, and an untouched input
  hidden: true
  code: |
    assert slowest_rate([8, 8, 8], 6) == 4
    assert slowest_rate([10], 3) == 4
    original = [5, 5]
    slowest_rate(original, 3)
    assert original == [5, 5], "the input must not be modified"

- id: basic
  label: Two overlapping jobs need two agents
  code: |
    assert agents_needed([(0, 30), (5, 10), (15, 20)]) == 2
- id: sequential
  label: Jobs that never overlap share one agent
  code: |
    assert agents_needed([(7, 10), (2, 4)]) == 1
- id: empty
  label: No jobs need no agents
  code: |
    assert agents_needed([]) == 0
- id: all-at-once
  label: Simultaneous jobs each need their own agent
  code: |
    assert agents_needed([(1, 5), (1, 5), (1, 5)]) == 3
- id: handover
  label: An agent freed at minute 10 can take a job starting at minute 10
  hidden: true
  code: |
    assert agents_needed([(0, 10), (10, 20), (20, 30)]) == 1
    assert agents_needed([(0, 10), (9, 20)]) == 2
- id: nesting-and-untouched
  label: Nested jobs, a single job, and an untouched input
  hidden: true
  code: |
    assert agents_needed([(0, 100), (10, 20), (12, 15), (80, 90)]) == 3
    assert agents_needed([(5, 6)]) == 1
    assert agents_needed([(-5, 0), (-3, 4)]) == 2
    original = [(3, 4), (1, 2)]
    agents_needed(original)
    assert original == [(3, 4), (1, 2)], "the input must not be modified"

id: pa-previous-lighter-package
kind: python
title: Nearest smaller package before this one
difficulty: 2
pattern: monotonic-stack
stage: s03-linear-structures
topics:
  - arrays
  - stacks
timeLimitMs: 15000
prompt: |
  `sizes` lists package sizes in the order they were published. For each
  package, return the index of the closest **earlier** package that is strictly
  smaller, or `-1` when every earlier package is at least as big.

  ```
  previous_lighter([4, 2, 5, 3, 6])   # [-1, -1, 1, 1, 3]
  previous_lighter([1, 2, 3])         # [-1, 0, 1]
  ```

  This looks backwards, but you can still answer it in a single left-to-right
  pass — nothing needs to be scanned twice.
hints:
  - "Think about which earlier packages could ever be the answer for a package you have not read yet. If package 7 is smaller than package 5, package 5 is useless from now on: anything that would settle for 5 would prefer 7."
  - "Keep a stack of indices whose sizes increase from bottom to top. Before recording an answer for the current package, pop every index whose size is at least the current size — those can never be anyone's answer again."
  - "After the popping, the stack's top is the answer (or the stack is empty and the answer is -1). Push the current index last, so a package never reports itself."
solutionWalkthrough: |
  ```python
  def previous_lighter(sizes):
      answer = []
      stack = []
      for i, size in enumerate(sizes):
          while stack and sizes[stack[-1]] >= size:
              stack.pop()
          answer.append(stack[-1] if stack else -1)
          stack.append(i)
      return answer
  ```

  The discard rule is the interesting part, and it is a dominance argument
  rather than an algorithmic trick: an earlier index that is both further away
  *and* not smaller is beaten on both axes at once, so nothing will ever choose
  it. Once you can name a dominance rule like that, a monotonic stack is usually
  the right structure, and the stack's invariant — strictly increasing sizes —
  is just that rule maintained.

  Popping on `>=` rather than `>` is what makes "strictly smaller" true. With
  `>`, a run of equal sizes reports its own neighbour, which is a different
  question.

  O(n) time, and O(n) memory only in the worst case of a strictly increasing
  series, where nothing is ever discarded. The obvious backwards scan from each
  index is O(1) memory and O(n²) time, so this is the usual memory-for-time
  trade — and on a list of twenty it is not worth making.

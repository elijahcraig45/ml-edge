- id: eight
  label: The classic answer for n = 8
  code: |
    assert count_queens(8) == 92
- id: small-boards
  label: n = 1 through 4
  code: |
    assert count_queens(1) == 1
    assert count_queens(2) == 0
    assert count_queens(3) == 0
    assert count_queens(4) == 2
- id: five-six-seven
  label: n = 5, 6, 7
  code: |
    assert [count_queens(n) for n in (5, 6, 7)] == [10, 4, 40]
- id: nine
  label: n = 9 finishes quickly, which means the search is pruned
  hidden: true
  code: |
    assert count_queens(9) == 352
- id: repeatable
  label: Calling it twice gives the same answer — no state left behind
  hidden: true
  code: |
    first = count_queens(6)
    second = count_queens(6)
    assert first == second == 4

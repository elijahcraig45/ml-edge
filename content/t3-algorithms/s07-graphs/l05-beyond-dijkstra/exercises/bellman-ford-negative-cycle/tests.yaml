- id: negative-edge
  label: Handles a negative edge Dijkstra would get wrong
  code: |
    nodes = ["s", "a", "b", "t"]
    edges = [("s", "a", 2), ("s", "b", 5), ("b", "a", -4), ("a", "t", 6)]
    assert bellman_ford(nodes, edges, "s") == {"s": 0, "a": 1, "b": 5, "t": 7}
- id: negative-cycle
  label: Reports None for a negative cycle
  code: |
    assert bellman_ford(["x", "y", "z"], [("x", "y", 1), ("y", "z", -3), ("z", "y", 1)], "x") is None
- id: edge-order-independent
  label: The answer does not depend on the order the edges are listed
  code: |
    nodes = ["s", "a", "b", "t"]
    edges = [("a", "t", 6), ("b", "a", -4), ("s", "b", 5), ("s", "a", 2)]
    assert bellman_ford(nodes, edges, "s") == {"s": 0, "a": 1, "b": 5, "t": 7}
- id: unreachable-excluded
  label: Unreachable nodes are left out
  code: |
    assert bellman_ford(["a", "b", "z"], [("a", "b", 4)], "a") == {"a": 0, "b": 4}
- id: long-chain
  label: A chain needs every one of the V-1 rounds
  hidden: true
  code: |
    # Listing the edges backwards means one round fixes exactly one hop.
    nodes = list("abcdef")
    edges = [("e", "f", 1), ("d", "e", 1), ("c", "d", 1), ("b", "c", 1), ("a", "b", 1)]
    assert bellman_ford(nodes, edges, "a") == {"a": 0, "b": 1, "c": 2, "d": 3, "e": 4, "f": 5}
- id: unreachable-negative-cycle
  label: A negative cycle the source cannot reach is not reported
  hidden: true
  code: |
    # p <-> q is a negative cycle, but nothing from "a" reaches it.
    nodes = ["a", "b", "p", "q"]
    edges = [("a", "b", 3), ("p", "q", -5), ("q", "p", 1)]
    assert bellman_ford(nodes, edges, "a") == {"a": 0, "b": 3}
- id: missing-source
  label: A source outside the node list gives an empty dict
  hidden: true
  code: |
    assert bellman_ford(["a"], [], "zzz") == {}
- id: self-negative-loop
  label: A negative self-loop is a negative cycle
  hidden: true
  code: |
    assert bellman_ford(["a", "b"], [("a", "b", 1), ("b", "b", -1)], "a") is None

- id: classic
  label: The textbook instance picks items 1 and 2
  code: |
    assert chosen_items([(1, 1), (3, 4), (4, 5), (5, 7)], 7) == [1, 2]
- id: registry
  label: The seven registry packages under 700 KB
  code: |
    items = [(190, 92000), (402, 31880), (22, 20200), (512, 11960),
             (18, 9080), (71, 7210), (154, 6460)]
    picked = chosen_items(items, 700)
    assert picked == [0, 1, 2, 4], picked
    assert sum(items[i][1] for i in picked) == 153160
- id: nothing-fits
  label: Nothing fits, or there is nothing to choose
  code: |
    assert chosen_items([(5, 9)], 3) == []
    assert chosen_items([], 700) == []
    assert chosen_items([(1, 5)], 0) == []
- id: duplicates
  label: Identical items are distinct choices
  code: |
    assert chosen_items([(2, 3), (2, 3), (2, 3)], 4) == [0, 1]
- id: tie-goes-to-skipping
  label: When taking and skipping tie, the later item is skipped
  hidden: true
  code: |
    assert chosen_items([(2, 5), (2, 5)], 2) == [0]
- id: feasible-and-optimal
  label: The subset fits and reaches the known optimum
  hidden: true
  code: |
    items = [(3, 10), (4, 11), (5, 12), (2, 4)]
    for capacity, optimum in ((9, 25), (7, 21), (2, 4), (14, 37)):
        picked = chosen_items(items, capacity)
        assert picked == sorted(set(picked)), picked
        assert sum(items[i][0] for i in picked) <= capacity, (capacity, picked)
        assert sum(items[i][1] for i in picked) == optimum, (capacity, picked)

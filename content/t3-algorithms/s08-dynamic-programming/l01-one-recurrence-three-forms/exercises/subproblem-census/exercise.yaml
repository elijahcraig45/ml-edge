id: subproblem-census
kind: python
title: Count the calls, count the states
difficulty: 2
pattern: instrumentation
topics: [recursion, memoization]
timeLimitMs: 15000
prompt: |
  Before you memoize anything, you should be able to prove the memo will pay
  off. This exercise builds the measurement.

  Write `census(target, sizes)` which runs the **naive** block-filling
  recursion — no cache — and reports two numbers:

  - how many times the recursive function was invoked, counting the top-level
    call and every base-case call;
  - how many **distinct** values of `target` it was invoked with, including the
    negative ones produced by overshooting.

  Return them as a tuple `(calls, distinct)`.

  The recursion is exactly the one from the lesson:

  ```
  f(t) = 0                      if t == 0
  f(t) = infinity               if t < 0
  f(t) = 1 + min(f(t - s) for s in sizes)   otherwise
  ```

  ```
  census(12, (1, 3, 4))   # (817, 16)
  census(0,  (1, 3, 4))   # (1, 1)
  ```

  `sizes` is always non-empty and every size is a positive integer. You do not
  have to return the answer to the block problem — only the census.
hints:
  - "The counting has to happen inside the recursive function, on every invocation, before any base case returns. A counter that only increments in the non-base branch will undercount."
  - "Two accumulators: an integer for calls and a set for the arguments seen. Because Python closures cannot rebind an outer integer, put the recursive helper inside `census` and use a one-element list, a `nonlocal`, or a mutable counter object."
  - "Order matters: increment the counter and add `t` to the set as the very first two statements of the helper, then do the base-case checks. `distinct` is `len(seen)` at the end."
solutionWalkthrough: |
  ```python
  def census(target, sizes):
      calls = 0
      seen = set()

      def f(t):
          nonlocal calls
          calls += 1
          seen.add(t)
          if t == 0:
              return 0
          if t < 0:
              return float("inf")
          return 1 + min(f(t - s) for s in sizes)

      f(target)
      return calls, len(seen)
  ```

  The instrumentation lives at the top of the helper because a call is a call —
  the base cases are invocations too, and they are a large fraction of the
  total. Counting only the recursive branch would report a smaller number and
  hide exactly the overhead you are trying to measure.

  Run it on `(1, 3, 4)` at targets 10, 12, 15 and 20 and the two columns pull
  apart: 313/14, 817/16, 3466/19, 38446/24. Calls grow like a power of the
  branching factor and distinct arguments grow like the target, so the ratio is
  the speed-up a memo would give you. That ratio is the number to quote when
  someone asks whether the cache is worth the memory.

  The negative arguments are worth keeping in the count rather than filtering
  out. They are real states — `f(-1)` is a genuine call that returns infinity —
  and if you were memoizing you would either store them or add a guard to avoid
  them. Both are decisions, and you cannot make them if you never counted them.

        (12,2,'owner'),(13,9,'owner'),(14,6,'contributor'),(15,10,'owner'),
        (16,3,'owner'),(17,7,'owner'),(17,8,'contributor'),(18,3,'owner'),
        (19,2,'owner'),(20,9,'owner');

  - name: downloads
    description: >-
      Daily download counts for the first ten days of March 2024. A short
      window on purpose — you should be able to hold the whole table in your
      head while you are still learning what a query does.
    columns:
      - { name: package_id, type: INTEGER, description: References packages.id. }
      - { name: day, type: DATE, description: Calendar day. }
      - { name: count, type: INTEGER, description: Downloads recorded that day. }
    seedSql: |
      CREATE OR REPLACE TABLE downloads (
        package_id INTEGER, day DATE, count INTEGER
      );
      INSERT INTO downloads
      SELECT
        p.id,
        DATE '2024-03-01' + INTERVAL (d) DAY,
        -- Deterministic, Zipf-ish: a few packages dominate, which is what
        -- makes the later skew lessons use real skew rather than a story.
        CAST(round(9000 / p.id + 40 * ((p.id * 7 + d * 13) % 11)) AS INTEGER)
      FROM packages p
      CROSS JOIN range(0, 10) t(d);

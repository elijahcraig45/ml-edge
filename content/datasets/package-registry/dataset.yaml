id: package-registry
title: Open-source package registry
license: Synthetic data generated for this curriculum. No real registry data.
description: >-
  A miniature package registry: packages, their releases, the people who
  maintain them, and daily download counts. Every SQL exercise in the
  curriculum uses this one schema, so you learn it once and it keeps paying
  off — the dependency graph becomes recursive CTEs in the graphs stage, the
  download time series becomes window functions, and the skewed event counts
  become the hashing stage's straggler problem.


  Nullable columns are deliberate. `license`, `deprecated_reason` and
  `country` are missing for some rows because that is what real registry data
  looks like, and because reasoning about missing values is a skill, not an
  edge case.

tables:
  - name: packages
    description: One row per published package.
    columns:
      - { name: id, type: INTEGER, description: Primary key. }
      - { name: name, type: VARCHAR, description: Package name, unique. }
      - { name: language, type: VARCHAR, description: "Implementation language: python, sql, rust, js." }
      - { name: license, type: VARCHAR, description: "SPDX identifier. NULL when the package never declared one." }
      - { name: created_at, type: DATE, description: First publication date. }
      - { name: deprecated_reason, type: VARCHAR, description: "Why it was deprecated. NULL means it is still active." }
    seedSql: |
      CREATE OR REPLACE TABLE packages (
        id INTEGER, name VARCHAR, language VARCHAR, license VARCHAR,
        created_at DATE, deprecated_reason VARCHAR
      );

  - name: package_maintainers
    description: >-
      Many-to-many link between packages and maintainers. Joining through this
      table is where fan-out bugs are born.
    columns:
      - { name: package_id, type: INTEGER, description: References packages.id. }
      - { name: maintainer_id, type: INTEGER, description: References maintainers.id. }
      - { name: role, type: VARCHAR, description: "owner or contributor." }
    seedSql: |
      CREATE OR REPLACE TABLE package_maintainers (
        package_id INTEGER, maintainer_id INTEGER, role VARCHAR
      );
      INSERT INTO package_maintainers VALUES
        (1,1,'owner'),(1,2,'contributor'),(2,3,'owner'),(3,2,'owner'),
